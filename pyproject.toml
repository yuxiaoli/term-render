[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "term-render"
version = "0.1.0"
description = "Route local files to external terminal viewers by extension and OS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sean" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "jsonschema>=4.23", "setuptools>=77", "wheel"]

[project.scripts]
render = "term_render.cli:main"

[tool.pyright]
extraPaths = ["src", "tests"]
typeCheckingMode = "standard"

[tool.setuptools]
packages = ["term_render", "term_render.configs"]

[tool.setuptools.package-dir]
term_render = "src/term_render"
"term_render.configs" = "configs"

[tool.setuptools.package-data]
"term_render.configs" = ["default-config.json"]
